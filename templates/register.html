<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Makes the page scale correctly on phones instead of showing a tiny "desktop" version -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenAlive Bwerenga Campus Connect</title>
    <!-- url_for() asks Flask for the correct path to our static folder,
         so this link keeps working even if the project moves later. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <main class="page">
        <h1>GENALIVE BWERENGA CAMPUS CONNECT</h1>
        <p>
            Hello, welcome to GenAlive Bwerenga Campus Connect, where we celebrate everyone as ONE.
            Enter your information so the church can remember and celebrate your birthday.
        </p>

        <form action="/register" method="POST" enctype="multipart/form-data">

            <div>
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" required>
            </div>

            <div>
                <label for="phone_number">Phone Number</label>
                <input type="tel" id="phone_number" name="phone_number" required>
            </div>
            
            <div>
                <label for="location">Location</label>
                <input type="tel" id="location" name="location" required>
            </div>

            <div>
                <label for="birthday">Birthday</label>
                <input type="date" id="birthday" name="birthday" required>
            </div>

            <div class="checkbox-row">
                <input type="checkbox" id="share_birthday" name="share_birthday">
                <label for="share_birthday">It's okay to share my birthday with the church</label>
            </div>

            <div>
                <label for="photo">Photo (optional)</label>
                <input type="file" id="photo" name="photo" accept="image/*">
            </div>

            <button type="submit">Register</button>
        </form>
    </main>

    {% include "partials/footer.html" %}

</body>
</html>
