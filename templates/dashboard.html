<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — GenAlive Bwerenga Campus Connect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <main class="page wide">
        <h1>Registered Members</h1>
        <p>Here's everyone who is registered so far.</p>

        <table>
            <tr>
                <th>Full Name</th>
                <th>Phone Number</th>
                <th>Birthday</th>
            </tr>
            {% for member in members %}
            <tr>
                <td><a href="/celebrate/{{ member.id }}">{{ member.full_name }}</a></td>
                <td>{{ member.phone_number }}</td>
                <td>{{ member.birthday }}</td>
            </tr>
            {% endfor %}
        </table>

        <p style="margin-top: 24px;"><a class="button" href="/">Back to Register</a></p>
    </main>

    {% include "partials/footer.html" %}

</body>
</html>
