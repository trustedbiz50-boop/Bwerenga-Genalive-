<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! — GenAlive Bwerenga Campus Connect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <main class="page">
        <div class="celebrate-card">
            <h1>Happy Birthday {{ person.full_name }}!</h1>

            {% if person.photo %}
                <img src="{{ person.photo }}" alt="{{ person.full_name }}'s photo">
            {% endif %}

            <p>Born on {{ person.birthday }}</p>

            <p>
                We are happy for you as we wish you a happy birthday and pray for you
                to blow more candles in Jesus' name. Wishing you a wonderful year ahead!
            </p>

            <a class="button" href="/">Go Home</a>
        </div>
    </main>

    {% include "partials/footer.html" %}
    <script src="{{url_for ('static', filename='js/balloons.js')}}"></script>

</body>
</html>
